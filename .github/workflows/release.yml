name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: knarr-watchman-linux-amd64
            binary_path: dist/knarr-watchman
          - os: windows-latest
            binary_name: knarr-watchman-windows-amd64.exe
            binary_path: dist/knarr-watchman.exe
          - os: macos-latest
            binary_name: knarr-watchman-macos-amd64
            binary_path: dist/knarr-watchman

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller build

      - name: Build watchman binary
        run: pyinstaller --clean --noconfirm knarr-watchman.spec

      - name: Build wheel and sdist
        run: python -m build

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "${{ matrix.binary_path }}" "release-artifacts/${{ matrix.binary_name }}"
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp dist/*.whl release-artifacts/
            cp dist/*.tar.gz release-artifacts/
          fi

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release-artifacts/*

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
